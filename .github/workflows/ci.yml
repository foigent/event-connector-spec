name: Protocol Conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out protocol authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Go 1.24.3
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.24.3
          cache: false
      - name: Set up Deno 2.7.13
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.13
      - name: Run current v1 and LiteLLM compatibility kit
        run: >-
          ./scripts/run-v1-compatibility-current-kit.sh
          "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/foigent-event-connector-kit"
      - name: Require a reproducible checkout
        run: git diff --exit-code
