name: Foigent Event Connector Protocol Pin
description: Verify a product protocol pin against this immutable protocol release.
inputs:
  pin:
    description: Path to the product-owned protocol pin JSON.
    required: true
  product:
    description: Product identity, either unirouter or xinsight.
    required: true
runs:
  using: composite
  steps:
    - name: Verify immutable protocol release
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/scripts/verify-candidate.mjs"
        node "$GITHUB_ACTION_PATH/scripts/compare-conformance.mjs"
        node "$GITHUB_ACTION_PATH/scripts/build-release-manifest.mjs" --check
    - name: Verify protocol release and product pin
      shell: bash
      env:
        FOIGENT_PROTOCOL_PIN: ${{ inputs.pin }}
        FOIGENT_PROTOCOL_PRODUCT: ${{ inputs.product }}
      run: >-
        node "$GITHUB_ACTION_PATH/scripts/verify-product-pin.mjs"
        --pin "$FOIGENT_PROTOCOL_PIN"
        --product "$FOIGENT_PROTOCOL_PRODUCT"
